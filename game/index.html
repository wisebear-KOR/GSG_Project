<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계시록: 말씀의 전쟁</title>
<meta name="description" content="말로만 세상을 움직이는 신. Chrome 내장 AI가 계시를 해석하는 보드게임풍 전략 게임.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="ambient" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="sigil" aria-hidden="true"><use href="#sigil"/></svg>
      <div>
        <h1>계시록</h1>
        <p>제1권 · 이웃의 불신자</p>
      </div>
    </div>
    <nav class="track" id="track" aria-label="라운드 진행"></nav>
    <div class="tools">
      <button class="chip" id="ai" type="button"><span class="dot"></span><span class="label">대사제</span> <b></b></button>
      <button class="chip icon-only" id="sound" type="button" title="소리"></button>
      <button class="chip icon-only" id="motion" type="button" title="연출"></button>
      <button class="chip" id="openChron" type="button">📜<span class="label"> 연대기</span></button>
      <a class="chip icon-only" href="../index.html" title="처음으로">⌂</a>
    </div>
  </header>

  <main class="table">
    <aside class="mat mat-player" id="matPlayer" aria-label="우리 부족"></aside>
    <section class="board-area">
      <div class="board-frame" id="boardFrame">
        <svg id="board" role="img" aria-label="육각 보드"></svg>
      </div>
    </section>
    <div class="side-col">
      <aside class="mat mat-enemy" id="matEnemy" aria-label="율법파"></aside>
      <div class="law-slot" id="law" aria-label="이번 율법"></div>
      <div class="season" id="season" aria-label="이번 계절"></div>
    </div>
  </main>

  <footer class="altar">
    <div class="altar-inner" id="altar"></div>
  </footer>
</div>

<aside class="drawer" id="chronicle" aria-label="연대기">
  <h2>연대기 <button class="btn-ghost" id="closeChron" type="button" style="height:34px;color:var(--ink);border-color:rgba(124,89,27,.5)">닫기</button></h2>
  <div class="chron" id="chronBody"></div>
</aside>
<div id="stage" aria-hidden="true"></div>

<script type="module" src="../js/game/main.js"></script>
</body>
</html>
