<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계시록: 말씀의 전쟁</title>
<meta name="description" content="말로만 세상을 움직이는 신. Chrome 내장 AI가 계시를 해석하는 보드게임풍 전략 게임.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game/style.css">
<style>
  .title-screen { position: relative; z-index: 2; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
  .title-screen .sigil { width: 120px; height: 120px; filter: drop-shadow(0 0 30px rgba(255, 190, 80, .55)); animation: float 6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .title-screen h1 { margin: 18px 0 6px; font: 800 clamp(56px, 11vw, 104px)/1 var(--font-display); letter-spacing: .14em; padding-left: .14em;
    background: linear-gradient(180deg, #fff7dc, var(--gold-hi) 45%, var(--gold) 75%, var(--gold-lo)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .8)); }
  .title-screen .sub { font: 700 clamp(18px, 3vw, 24px) var(--font-body); letter-spacing: .3em; padding-left: .3em; color: var(--on-table); }
  .title-screen .rule { width: 240px; height: 2px; margin: 22px auto; background: linear-gradient(90deg, transparent, var(--gold-hi), transparent); }
  .title-screen .lede { max-width: 620px; text-wrap: balance; margin: 0 auto 30px; font: 17px/1.8 var(--font-body); color: var(--on-table-dim); }
  .title-screen .lede b { color: var(--on-table); font-weight: 700; }
  .title-screen .start { height: 58px; padding: 0 38px; font-size: 18px; text-decoration: none; }
  .title-screen .links { margin-top: 26px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .title-screen .foot { margin-top: 34px; font: 12px var(--font-ui); color: var(--on-table-dim); opacity: .7; }
  .title-screen .foot a { color: inherit; }
  .fade { animation: fadeUp 1.1s cubic-bezier(.16, 1, .3, 1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<canvas id="ambient" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<main class="title-screen">
  <div>
    <svg class="sigil fade" aria-hidden="true"><use href="#sigil"/></svg>
    <h1 class="fade" style="animation-delay:.15s">계시록</h1>
    <div class="sub fade" style="animation-delay:.3s">말씀의 전쟁</div>
    <div class="rule fade" style="animation-delay:.45s"></div>
    <p class="lede fade" style="animation-delay:.55s">너는 <b>말로만 세상을 움직이는 신</b>이다.<br>
      계시를 내리면 대사제가 그 뜻을 헤아려 신도들을 움직인다.<br>
      신 없이 율법대로만 사는 이웃과 겨루어, 열두 장 안에 너의 말씀을 세상에 새겨라.</p>
    <a class="btn-primary start fade" style="animation-delay:.7s" href="game/index.html">제1권 · 이웃의 불신자 시작</a>
    <div class="links fade" style="animation-delay:.85s">
      <a class="chip" href="check.html">내장 AI 점검</a>
      <a class="chip" href="lab/interpret.html">해석기 실험실</a>
      <a class="chip" href="https://github.com/wisebear-KOR/GSG_Project">GitHub</a>
    </div>
    <p class="foot fade" style="animation-delay:1s">데스크톱 Chrome의 내장 AI(Prompt API)로 동작하며, 쓸 수 없는 환경에서는 석판(키워드) 해석기로 플레이한다 · MIT License</p>
  </div>
</main>
<script type="module">
  import { installArt } from './js/game/art.js';
  import { ambient } from './js/game/fx.js';
  installArt();
  ambient(document.getElementById('ambient'));
</script>
</body>
</html>
